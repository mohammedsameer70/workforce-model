spring.application.name=workForceApplication

# Allow bean overriding for tests
spring.main.allow-bean-definition-overriding=true

# H2 Database for testing
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA configuration for testing
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Disable SQL initialization for tests
spring.sql.init.mode=never

# JWT Configuration
jwt.secret=ZGVmYXVsdFNlY3JldEtleVRoYXJJc0xvbmdFbm91Z2hGb3JIUzI1NkFsZ29yaXRobQ==
jwt.expiration=86400000

# FastAPI configuration (mock URLs for testing)
fastapi.base-url=http://localhost:8000
python.api.url=http://localhost:8000/train
python.download.url=http://localhost:8000/train/cleaned-dataset

# File paths (mock for testing)
prediction.csv.path=/tmp/predictions.csv

# Multipart configuration
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
